name: validate

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 catalog/validate.py

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: sdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;34.0.0" >/dev/null
      - name: build
        run: ./launcher/build.sh
      - name: no permissions
        run: |
          perms=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions launcher/build/dumbtv-home.apk | grep -c uses-permission || true)
          [ "$perms" = 0 ] || { echo "the launcher must request no permissions, found $perms"; exit 1; }
      - name: build optional search companion
        run: bash search/build.sh
      - name: offline search filter tests
        run: |
          curl -fsSL 'https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar' -o "$RUNNER_TEMP/evma-json.jar"
          echo "3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  $RUNNER_TEMP/evma-json.jar" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/evma-search-tests"
          javac --release 8 -encoding UTF-8 -cp "$RUNNER_TEMP/evma-json.jar" -d "$RUNNER_TEMP/evma-search-tests" search/src/tv/evma/search/Catalog.java search/tests/tv/evma/search/CatalogTest.java search/src/tv/evma/search/WeatherData.java search/tests/tv/evma/search/WeatherDataTest.java launcher/src/tv/dumbtv/home/Order.java launcher/tests/tv/dumbtv/home/OrderTest.java
          java -cp "$RUNNER_TEMP/evma-search-tests:$RUNNER_TEMP/evma-json.jar" tv.evma.search.CatalogTest
          java -cp "$RUNNER_TEMP/evma-search-tests:$RUNNER_TEMP/evma-json.jar" tv.evma.search.WeatherDataTest
          java -cp "$RUNNER_TEMP/evma-search-tests:$RUNNER_TEMP/evma-json.jar" tv.dumbtv.home.OrderTest

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: for f in scripts/*.sh launcher/*.sh search/*.sh; do bash -n "$f" || exit 1; done
      - name: launcher version manifest
        run: ./launcher/release-check.sh --manifest
      - name: no private addresses or hardware ids
        run: |
          if grep -rnE '\b(10|172|192)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b|\b([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}\b' \
               --exclude-dir=.git --exclude-dir=report \
               --include='*.md' --include='*.sh' --include='*.txt' --include='*.yaml' \
               --include='*.yml' --include='*.json' --include='*.py' .; then
            echo "remove the private addresses above; they belong in dumbtv.conf, not the repo"; exit 1
          fi
